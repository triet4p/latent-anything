site_name: Latent-Anything Theory
site_url: https://triet4p.github.io/latent-anything/
site_description: Nghiên cứu lý thuyết cho dự án Latent-Anything — không gian ẩn, đa tạp, metric, và hình học.
site_author: Le Minh Triet
repo_url: https://github.com/triet4p/latent-anything
repo_name: triet4p/latent-anything

docs_dir: latent-anything-theory
site_dir: .gh-pages-build

exclude_docs: |
  .venv/**
  uv.lock
  pyproject.toml
  __pycache__/**
  *.pyc

theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: vi
  - mkdocs-jupyter:
      execute: false
      include_source: true

nav:
  - Trang chủ: README.md
  - "1. Biểu diễn không gian":
      - "Metric Space & Vector Space": 01-space-representation/research/01-metric-space-vector-space.md
      - "Khoảng cách Mahalanobis": 01-space-representation/research/02-mahalanobis-distance.md
      - "Giả thuyết Đa tạp": 01-space-representation/research/03-manifold-hypothesis.md
      - "Lời nguyền chiều": 01-space-representation/research/04-curse-of-dimensionality.md
      - "Geodesic": 01-space-representation/research/05-geodesic.md
      - "Pullback Metric": 01-space-representation/research/06-pullback-metric.md
      - "FlatVI": 01-space-representation/research/07-flatvi.md
      - Notebooks:
          - "Hiệp phương sai & Mahalanobis": 01-space-representation/notebooks/02_covariance_and_mahalanobis_exercise.ipynb
          - "Đa tạp & Lời nguyền chiều": 01-space-representation/notebooks/03_manifold_hypothesis_and_curse_of_dimensionality.ipynb
          - "Geodesic, Pullback & FlatVI": 01-space-representation/notebooks/05_06_07_geodesic_pullback_flatvi.ipynb
  - "2. Representation Learning":
      - "Information Bottleneck": 02-representation-learning/research/01-information-bottleneck.md
      - "Autoencoder": 02-representation-learning/research/02-autoencoder.md
      - "VAE": 02-representation-learning/research/03-vae.md
      - "VQ-VAE": 02-representation-learning/research/04-vq-vae.md
      - "VQGAN": 02-representation-learning/research/05-vqgan.md
      - Notebooks:
          - "Information Bottleneck": 02-representation-learning/notebooks/01_information_bottleneck.ipynb
          - "Autoencoder": 02-representation-learning/notebooks/02_autoencoder.ipynb
          - "Variational Autoencoder": 02-representation-learning/notebooks/03_vae.ipynb
          - "VQ-VAE": 02-representation-learning/notebooks/04_vq_vae.ipynb
          - "VQGAN": 02-representation-learning/notebooks/05_vqgan.ipynb
  - "3. Hình học & Cấu trúc":
      - "Cấu trúc tuyến tính": 03-geometry-structure/research/01-linear-structure.md
      - Notebooks:
          - "Cấu trúc tuyến tính": 03-geometry-structure/notebooks/01_linear_structure.ipynb

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/triet4p/latent-anything
