site_name: Latent-Anything Theory
site_url: https://triet4p.github.io/latent-anything/
site_description: Nghiên cứu lý thuyết cho dự án Latent-Anything — không gian ẩn, đa tạp, metric, và hình học.
site_author: Le Minh Triet
repo_url: https://github.com/triet4p/latent-anything
repo_name: triet4p/latent-anything

docs_dir: latent-anything-theory
site_dir: .gh-pages-build

exclude_docs: |
  .venv/**
  uv.lock
  pyproject.toml
  __pycache__/**
  *.pyc

theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: vi
  - mkdocs-jupyter:
      execute: false
      include_source: true

