          - "Slerp — Nội suy cầu": 04-latent-computation/notebooks/02_slerp.ipynb
          - "Latent Arithmetic": 04-latent-computation/notebooks/03_latent_arithmetic.ipynb
          - "Subspace Projection": 04-latent-computation/notebooks/04_subspace_projection.ipynb
          - "Mahalanobis Distance": 04-latent-computation/notebooks/05_mahalanobis_distance.ipynb
          - "Density Estimation": 04-latent-computation/notebooks/06_density_estimation.ipynb
          - "Optimal Transport trong Latent": 04-latent-computation/notebooks/07_optimal_transport_in_latent.ipynb

  - "5. Probe & Can thiệp":
