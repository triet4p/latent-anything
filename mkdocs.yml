      - "Nonlinear Probing": 05-probing-intervention/research/02-nonlinear-probing.md
      - "TCAV — Concept Activation Vectors": 05-probing-intervention/research/03-tcav.md
      - "Can thiệp Nhân quả vs Quan sát": 05-probing-intervention/research/04-causal-intervention-vs-observational.md
      - "Activation Patching": 05-probing-intervention/research/05-activation-patching.md
      - Notebooks:
          - "Linear Probing": 05-probing-intervention/notebooks/01_linear_probing.ipynb
          - "Nonlinear Probing": 05-probing-intervention/notebooks/02_nonlinear_probing.ipynb
          - "TCAV — Concept Activation Vectors": 05-probing-intervention/notebooks/03_tcav.ipynb
          - "Can thiệp Nhân quả vs Quan sát": 05-probing-intervention/notebooks/04_causal_intervention_vs_observational.ipynb
          - "Activation Patching": 05-probing-intervention/notebooks/05_activation_patching.ipynb

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/triet4p/latent-anything
