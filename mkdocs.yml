site_name: Latent-Anything Theory
site_url: https://triet4p.github.io/latent-anything/
site_description: Nghiên cứu lý thuyết cho dự án Latent-Anything — không gian ẩn, đa tạp, metric, và hình học.
site_author: Le Minh Triet
repo_url: https://github.com/triet4p/latent-anything
repo_name: triet4p/latent-anything

docs_dir: latent-anything-theory
site_dir: .gh-pages-build

exclude_docs: |
  .venv/**
  uv.lock
  pyproject.toml
  __pycache__/**
  *.pyc

theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Chuyển sang chế độ tối
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: vi
  - mkdocs-jupyter:
      execute: false
      include_source: true

nav:
  - Trang chủ: README.md
  - "1. Biểu diễn không gian":
      - "Metric Space & Vector Space": 01-space-representation/research/01-metric-space-vector-space.md
      - "Khoảng cách Mahalanobis": 01-space-representation/research/02-mahalanobis-distance.md
      - "Giả thuyết Đa tạp": 01-space-representation/research/03-manifold-hypothesis.md
      - "Lời nguyền chiều": 01-space-representation/research/04-curse-of-dimensionality.md
      - "Geodesic": 01-space-representation/research/05-geodesic.md
      - "Pullback Metric": 01-space-representation/research/06-pullback-metric.md
      - "FlatVI": 01-space-representation/research/07-flatvi.md
      - Notebooks:
          - "Hiệp phương sai & Mahalanobis": 01-space-representation/notebooks/02_covariance_and_mahalanobis_exercise.ipynb
          - "Đa tạp & Lời nguyền chiều": 01-space-representation/notebooks/03_manifold_hypothesis_and_curse_of_dimensionality.ipynb
          - "Geodesic, Pullback & FlatVI": 01-space-representation/notebooks/05_06_07_geodesic_pullback_flatvi.ipynb
  - "2. Representation Learning":
      - "Information Bottleneck": 02-representation-learning/research/01-information-bottleneck.md
      - "Autoencoder": 02-representation-learning/research/02-autoencoder.md
      - "VAE": 02-representation-learning/research/03-vae.md
      - "VQ-VAE": 02-representation-learning/research/04-vq-vae.md
      - "VQGAN": 02-representation-learning/research/05-vqgan.md
      - Notebooks:
          - "Information Bottleneck": 02-representation-learning/notebooks/01_information_bottleneck.ipynb
          - "Autoencoder": 02-representation-learning/notebooks/02_autoencoder.ipynb
          - "Variational Autoencoder": 02-representation-learning/notebooks/03_vae.ipynb
          - "VQ-VAE": 02-representation-learning/notebooks/04_vq_vae.ipynb
          - "VQGAN": 02-representation-learning/notebooks/05_vqgan.ipynb
  - "3. Hình học & Cấu trúc":
      - "Cấu trúc tuyến tính": 03-geometry-structure/research/01-linear-structure.md
      - "Tính tách biệt biểu diễn": 03-geometry-structure/research/02-disentanglement.md
      - "Đẳng hướng & Bất đẳng hướng": 03-geometry-structure/research/03-isotropy-anisotropy.md
      - "Hình học Riemannian": 03-geometry-structure/research/04-riemannian-geometry.md
      - "Slerp": 03-geometry-structure/research/05-slerp.md
      - "Normalizing Flows": 03-geometry-structure/research/06-normalizing-flows.md
      - Notebooks:
          - "Cấu trúc tuyến tính": 03-geometry-structure/notebooks/01_linear_structure.ipynb
          - "Tính tách biệt biểu diễn": 03-geometry-structure/notebooks/02_disentanglement.ipynb
          - "Đẳng hướng & Bất đẳng hướng": 03-geometry-structure/notebooks/03_isotropy_anisotropy.ipynb
          - "Hình học Riemannian": 03-geometry-structure/notebooks/04_riemannian_geometry.ipynb
          - "Slerp": 03-geometry-structure/notebooks/05_slerp.ipynb
          - "Normalizing Flows": 03-geometry-structure/notebooks/06_normalizing_flows.ipynb
  - "3B. 3D Representation":
      - "Neural Implicit Representation": 03b-3d-representation/research/01-neural-implicit-representation.md
      - "NeRF": 03b-3d-representation/research/02-nerf.md
      - "Volume Rendering & Ray Marching": 03b-3d-representation/research/03-volume-rendering-ray-marching.md
      - "Positional Encoding": 03b-3d-representation/research/04-positional-encoding.md
      - "Instant-NGP": 03b-3d-representation/research/05-instant-ngp.md
      - "3D Gaussian Splatting": 03b-3d-representation/research/06-3d-gaussian-splatting.md
      - "Covariance Matrix trong 3DGS": 03b-3d-representation/research/07-covariance-matrix-3dgs.md
      - "Spherical Harmonics": 03b-3d-representation/research/08-spherical-harmonics.md
      - "Gaussian Rasterization": 03b-3d-representation/research/09-gaussian-rasterization.md
      - "Gaussian Parameters là Latent": 03b-3d-representation/research/10-gaussian-parameters-latent-variable.md
      - "Dynamic 3DGS": 03b-3d-representation/research/11-dynamic-3dgs.md
      - "Gaussian Set Operations": 03b-3d-representation/research/12-gaussian-set-operations.md
      - Notebooks:
          - "Neural Implicit Representation": 03b-3d-representation/notebooks/01_neural_implicit_representation.ipynb
          - "NeRF": 03b-3d-representation/notebooks/02_nerf.ipynb
          - "Volume Rendering & Ray Marching": 03b-3d-representation/notebooks/03_volume_rendering_ray_marching.ipynb
          - "Positional Encoding": 03b-3d-representation/notebooks/04_positional_encoding.ipynb
          - "Instant-NGP": 03b-3d-representation/notebooks/05_instant_ngp.ipynb
          - "3DGS & Hiệp phương sai": 03b-3d-representation/notebooks/06_07_3d_gaussian_splatting_covariance.ipynb
          - "Spherical Harmonics": 03b-3d-representation/notebooks/08_spherical_harmonics.ipynb
          - "Gaussian Rasterization": 03b-3d-representation/notebooks/09_gaussian_rasterization.ipynb
          - "Gaussian Latent State": 03b-3d-representation/notebooks/10_gaussian_parameters_latent_variable.ipynb
          - "Dynamic 3DGS": 03b-3d-representation/notebooks/11_dynamic_3dgs.ipynb
          - "Gaussian Set Operations": 03b-3d-representation/notebooks/12_gaussian_set_operations.ipynb

  - "4. Tính toán trong Latent Space":
      - "Lerp — Linear Interpolation": 04-latent-computation/research/01-lerp.md
      - "Slerp — Spherical Interpolation": 04-latent-computation/research/02-slerp.md
      - "Latent Arithmetic": 04-latent-computation/research/03-latent-arithmetic.md
      - "Subspace Projection": 04-latent-computation/research/04-subspace-projection.md
      - "Mahalanobis Distance": 04-latent-computation/research/05-mahalanobis-distance.md
      - "Density Estimation": 04-latent-computation/research/06-density-estimation.md
      - "Optimal Transport trong Latent": 04-latent-computation/research/07-optimal-transport-in-latent.md
      - Notebooks:
