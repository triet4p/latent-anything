[project]
name = "latent-anything"
version = "0.1.0b1"
description = "Latent Understanding, Manipulation & Execution Network — a Python framework that treats latent space as a first-class object"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [
    { name = "latent-anything contributors" },
]

dependencies = [
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.6,<2.0",
    "matplotlib>=3.9,<4.0",
    "umap-learn>=0.5,<1.0",
    "torch>=2.5,<3.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
latent-anything = "latent_anything.cli:main"

[project.optional-dependencies]
diffusers = ["diffusers>=0.30,<1.0", "safetensors>=0.4,<1.0"]
transformers = ["transformers>=4.45,<5.0", "tokenizers>=0.20,<1.0"]
diffusers-full = ["diffusers>=0.30,<1.0", "safetensors>=0.4,<1.0", "transformers>=4.45,<5.0", "tokenizers>=0.20,<1.0"]
"3d" = ["gsplat>=1.4,<2.0"]
# Sprint 56 supports the stable 0.6.x API surface. LeRobot's moving main
# branch is intentionally excluded; an upgrade requires the compatibility
# checklist and smoke lane in docs/LEROBOT_INTEGRATION.md.
lerobot = ["lerobot[dataset,evaluation]>=0.6.0,<0.7.0"]
lerobot-diffusion = ["lerobot[dataset,evaluation,diffusion]>=0.6.0,<0.7.0"]
# Sprint 60 adds the SmolVLA policy profile. LeRobot's `smolvla` extra pulls
# the Transformers 5.x line and accelerate; keep it isolated from the legacy
# 4.x profiles exactly like the Diffusion profile. Sprint 61 adds LeRobot's
# `libero` environment extra (Linux-only) for the causal simulation benchmark.
lerobot-smolvla = ["lerobot[dataset,evaluation,smolvla,libero]>=0.6.0,<0.7.0"]
viz = ["plotly>=5.24,<7.0", "kaleido>=1.0.0", "ipywidgets>=8.0,<9.0", "anywidget>=0.9,<1.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.uv]
# LeRobot 0.6.x requires huggingface-hub>=1.0 and its policy extras use
# Transformers 5.x, while the legacy Diffusers/Transformers extras in this
# project intentionally remain on the 4.x/hub<1 line. Keep these install
# profiles resolvable in separate forks and reject accidental co-installation.
conflicts = [
    [{ extra = "lerobot" }, { extra = "transformers" }],
    [{ extra = "lerobot" }, { extra = "diffusers-full" }],
    [{ extra = "lerobot-diffusion" }, { extra = "transformers" }],
    [{ extra = "lerobot-diffusion" }, { extra = "diffusers-full" }],
    [{ extra = "lerobot-smolvla" }, { extra = "transformers" }],
    [{ extra = "lerobot-smolvla" }, { extra = "diffusers-full" }],
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "B905",  # zip()-without-explicit-strict — allow when strict is not needed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
typeCheckingMode = "strict"
include = [
    "src",
    "scripts/anisotropy_benchmark.py",
    "scripts/benchmark_geometry_dispatch.py",
    "scripts/concept_removal_benchmark.py",
    "scripts/conv_vae_digits_evidence.py",
    "src/latent_anything/mlp_probe.py",
    "src/latent_anything/probes.py",
    "tests/test_mlp_probe.py",
    "tests/test_probes.py",
    "scripts/diffusers_vae_interpolation.py",
    "scripts/diffusers_conditional_timestep_trajectory.py",
    "scripts/diffusers_conditional_intervention_experiment.py",
    "scripts/end_to_end_showcase_demo.py",
    "scripts/end_to_end_transformer_lm_demo.py",
    "scripts/interactive_viz_walkthrough.py",
    "scripts/geodesic_benchmark.py",
    "scripts/latent_arithmetic_benchmark.py",
    "scripts/projection_basis_comparison.py",
    "scripts/report_config_migration.py",
    "scripts/vae_explanation_benchmark.py",
    "scripts/validate_evidence_ledger.py",
    "scripts/vq_vae_digits_evidence.py",
    "scripts/jepa_world_model_benchmark.py",
    "scripts/act_policy_representation_benchmark.py",
    "scripts/diffusion_policy_representation_benchmark.py",
    "scripts/smolvla_policy_representation_benchmark.py",
    "scripts/smolvla_simulation_benchmark.py",
    "scripts/deterministic_transition_benchmark.py",
    "scripts/stochastic_transition_benchmark.py",
    "tests/test_api_surface.py",
    "tests/test_diffusers_vae.py",
    "tests/test_diffusers_vae_network.py",
    "tests/test_diffusers_conditional.py",
    "tests/test_diffusers_conditional_network.py",
    "tests/test_transformer_lm.py",
    "tests/test_transformer_lm_network.py",
    "tests/test_integrated_gradients.py",
    "tests/test_integrated_gradients_network.py",
    "tests/test_sae_evaluation.py",
    "tests/test_sae_evaluation_network.py",
    "tests/test_evaluation.py",
    "tests/test_integrations.py",
    "tests/test_latent_anything/test_capture.py",
    "tests/test_latent_anything/test_conv_vae.py",
    "tests/test_latent_anything/test_conv_vae_evidence.py",
    "tests/test_latent_anything/test_covariance_geometry.py",
    "tests/test_latent_anything/test_demo_smoke.py",
    "tests/test_latent_anything/test_geodesic.py",
    "tests/test_latent_anything/test_latent_arithmetic.py",
    "tests/test_latent_anything/test_latent_space.py",
    "tests/test_latent_anything/test_jepa.py",
    "tests/test_latent_anything/test_jepa_checkpoint.py",
    "tests/test_latent_anything/test_latent_value.py",
    "tests/test_latent_anything/test_projection.py",
    "tests/test_registry_migration.py",
    "tests/test_lerobot_act.py",
    "tests/test_lerobot_benchmark.py",
    "tests/test_lerobot_diffusion.py",
    "tests/test_lerobot_smolvla.py",
    "tests/test_scripts/test_validate_evidence_ledger.py",
    "tests/test_visualization_data.py",
    "tests/test_visualization_figures.py",
    "tests/test_visualization_isolation.py",
    "tests/test_visualization_render.py",
    "tests/test_visualization_walkthrough.py",
    "tests/test_dtw.py",
    "tests/test_temporal.py",
    "tests/test_latent_anything/test_transition.py",
    "tests/test_latent_anything/test_gaussian_3d_manipulation.py",
    "tests/test_latent_anything/test_gaussian_3d_renderer.py",
    "tests/test_latent_anything/test_gaussian_3d_renderer_network.py",
    "tests/test_latent_anything/test_pose.py",
    "tests/test_latent_anything/test_vq_vae.py",
    "tests/test_vq_vae_benchmark.py",
  ]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
pythonPlatform = "All"
# NumPy 2.4 exposes ndarray as a generic, while the public API intentionally
# uses shape/dtype-agnostic ``np.ndarray`` annotations throughout the project.
# Keep strict checking for concrete types, but avoid cascading unknown-type
# diagnostics from that intentionally erased array shape and dtype.
reportMissingTypeArgument = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportUnknownParameterType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryCast = "none"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: test deliberately permitted to access a remote model host",
    "large_download: test needs a pretrained checkpoint and is off by default",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.3",
    "pyright>=1.1.410",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
