name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "latent-anything-theory/**"
      - "docs/**"
      - "mkdocs.yml"
      - "**.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync environment
        run: uv sync --locked --extra viz

      - name: Validate evidence ledger
        run: uv run python scripts/validate_evidence_ledger.py

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -v
