name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag to create after all release gates pass
        required: true
        type: string

jobs:
  gate-and-build:
    name: Release gate and reproducible package build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.verify_ref.outputs.release_tag }}
      commit: ${{ steps.verify_ref.outputs.commit }}
      release_name: ${{ steps.release_notes.outputs.title }}
      prerelease: ${{ steps.release_notes.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify release candidate and unused tag
        id: verify_ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release dispatch must use the main branch; got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable semantic version; got $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG#v}" != "1.0.0" ]]; then
            echo "Release tag must match the 1.0.0 package candidate; got $RELEASE_TAG" >&2
            exit 1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          checkout_commit="$(git rev-parse HEAD)"
          {
            echo "release_tag=$RELEASE_TAG"
            echo "commit=$checkout_commit"
            echo "commit_epoch=$(git show -s --format=%ct "$checkout_commit")"
          } >> "$GITHUB_OUTPUT"
          echo "Verified release candidate $RELEASE_TAG -> $checkout_commit"

      - name: Sync environment
        run: uv sync --locked --extra docs --extra viz --group ci-proofs
      - name: Cache pinned transformer proof inputs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/huggingface
          key: ${{ runner.os }}-hf-gpt2-e7da7f221d5bf496a48136c0cd264e630fe9fcc8-wikitext-f776294184f13b8ff2337b3841cf9269a6216d1e
      - name: Download pinned GPT-2 proof snapshot
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: |
          uv run --locked --no-sync python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='openai-community/gpt2', revision='e7da7f221d5bf496a48136c0cd264e630fe9fcc8', allow_patterns=['config.json', 'generation_config.json', 'merges.txt', 'model.safetensors', 'tokenizer.json', 'vocab.json'])"
      - name: Enforce depth-first release stop
        run: uv run --locked --no-sync python scripts/check_release_readiness.py

      - name: MkDocs strict
        run: uv run --locked --no-sync mkdocs build --strict

      - name: Ruff check
        run: uv run --locked --no-sync ruff check src tests scripts

      - name: Ruff format check
        run: uv run --locked --no-sync ruff format --check src tests scripts

      - name: Pyright
        run: uv run --locked --no-sync pyright

      - name: Pytest
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
        run: uv run --locked --no-sync pytest -v

      - name: Extract release notes
        id: release_notes
        run: |
          uv run --locked --no-sync python scripts/extract_release_notes.py \
            "$RELEASE_TAG" \
            --body-file "${RUNNER_TEMP}/release-body.md" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build wheel and sdist
        env:
          SOURCE_DATE_EPOCH: ${{ steps.verify_ref.outputs.commit_epoch }}
        run: |
          rm -rf dist
          uv build --wheel --sdist --out-dir dist

      - name: Normalize sdist archive metadata
        env:
          SOURCE_DATE_EPOCH: ${{ steps.verify_ref.outputs.commit_epoch }}
        run: |
          python - <<'PY'
          import gzip
          import io
          import os
          import tarfile
          from pathlib import Path

          source = Path("dist/latent_anything-1.0.0.tar.gz")
          temporary = source.with_suffix(source.suffix + ".tmp")
          epoch = int(os.environ["SOURCE_DATE_EPOCH"])
          with (
              tarfile.open(source, "r:gz") as original,
              temporary.open("wb") as raw,
              gzip.GzipFile(fileobj=raw, mode="wb", mtime=epoch) as compressed,
              tarfile.open(fileobj=compressed, mode="w", format=tarfile.PAX_FORMAT) as normalized,
          ):
              for member in original.getmembers():
                  data = original.extractfile(member).read() if member.isfile() else None
                  member.mtime = epoch
                  member.uid = 0
                  member.gid = 0
                  member.uname = ""
                  member.gname = ""
                  member.pax_headers = {}
                  normalized.addfile(member, io.BytesIO(data) if data is not None else None)
          os.replace(temporary, source)
          PY

      - name: Validate package contents and record provenance
        env:
          RELEASE_COMMIT: ${{ steps.verify_ref.outputs.commit }}
          RELEASE_TAG: ${{ steps.verify_ref.outputs.release_tag }}
          SOURCE_DATE_EPOCH: ${{ steps.verify_ref.outputs.commit_epoch }}
        run: |
          cp "${{ steps.release_notes.outputs.body_path }}" dist/release-body.md
          uv run --locked --no-sync python - <<'PY'
          import email
          import hashlib
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          expected = {
              "latent_anything-1.0.0-py3-none-any.whl",
              "latent_anything-1.0.0.tar.gz",
          }
          actual = {path.name for path in dist.iterdir() if path.is_file() and path.suffix in {".whl", ".gz"}}
          if actual != expected:
              raise SystemExit(f"unexpected distribution set: {sorted(actual)}")

          def check_name(name: str) -> None:
              if name.startswith("/") or ".." in Path(name).parts:
                  raise SystemExit(f"unsafe archive path: {name}")

          def check_metadata(raw: bytes, source: str) -> None:
              metadata = email.message_from_bytes(raw)
              if metadata.get("Name") != "latent-anything" or metadata.get("Version") != "1.0.0":
                  raise SystemExit(f"invalid metadata in {source}")

          wheel = dist / "latent_anything-1.0.0-py3-none-any.whl"
          with zipfile.ZipFile(wheel) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("wheel CRC validation failed")
              names = archive.namelist()
              for name in names:
                  check_name(name)
              metadata_names = [name for name in names if name.endswith(".dist-info/METADATA")]
              if len(metadata_names) != 1 or "latent_anything/__init__.py" not in names:
                  raise SystemExit("wheel content contract failed")
              check_metadata(archive.read(metadata_names[0]), wheel.name)

          sdist = dist / "latent_anything-1.0.0.tar.gz"
          with tarfile.open(sdist, "r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  check_name(member.name)
              root = members[0].name.split("/", 1)[0]
              metadata_names = [member.name for member in members if member.name == f"{root}/PKG-INFO"]
              package_names = [member.name for member in members if member.name.endswith("/src/latent_anything/__init__.py")]
              if len(metadata_names) != 1 or not package_names:
                  raise SystemExit("sdist content contract failed")
              check_metadata(archive.extractfile(metadata_names[0]).read(), sdist.name)

          files = []
          for name in sorted(expected):
              path = dist / name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files.append({"name": name, "bytes": path.stat().st_size, "sha256": digest})
          (dist / "SHA256SUMS").write_text(
              "".join(f"{item['sha256']}  {item['name']}\n" for item in files),
              encoding="utf-8",
          )
          provenance = {
              "schema": "latent-anything-release-provenance-v1",
              "tag": os.environ["RELEASE_TAG"],
              "commit": os.environ["RELEASE_COMMIT"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_date_epoch": os.environ["SOURCE_DATE_EPOCH"],
              "files": files,
          }
          (dist / "PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(provenance, sort_keys=True))
          PY

      - name: Upload immutable build evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.verify_ref.outputs.release_tag }}-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/PROVENANCE.json
            dist/release-body.md
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  attest-artifacts:
    name: Attest verified release artifacts
    needs: gate-and-build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.gate-and-build.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.gate-and-build.outputs.commit }}

    steps:
      - name: Download verified build evidence
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.gate-and-build.outputs.release_tag }}-${{ github.run_id }}
          path: dist

      - name: Verify package checksums and provenance before attestation
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          expected = {
              "latent_anything-1.0.0-py3-none-any.whl",
              "latent_anything-1.0.0.tar.gz",
          }
          provenance = json.loads((dist / "PROVENANCE.json").read_text(encoding="utf-8"))
          if (
              provenance.get("schema") != "latent-anything-release-provenance-v1"
              or provenance.get("tag") != os.environ["RELEASE_TAG"]
              or provenance.get("commit") != os.environ["RELEASE_COMMIT"]
              or provenance.get("repository") != os.environ["GITHUB_REPOSITORY"]
          ):
              raise SystemExit("release artifact provenance does not match the approved candidate")
          files = provenance.get("files")
          if not isinstance(files, list):
              raise SystemExit("release artifact provenance has no file records")
          recorded = {item["name"]: item["sha256"] for item in files}
          if len(recorded) != len(files) or set(recorded) != expected:
              raise SystemExit(f"unexpected provenance file set: {sorted(recorded)}")
          for name, digest in recorded.items():
              actual = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              if digest != actual:
                  raise SystemExit(f"provenance digest mismatch for {name}")
          PY

      - name: Attest release distributions and integrity metadata
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/PROVENANCE.json

  create-release-tag:
    name: Create approved release tag
    needs:
      - gate-and-build
      - attest-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.gate-and-build.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.gate-and-build.outputs.commit }}

    steps:
      - name: Require release GitHub App credentials
        shell: bash
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = ("RELEASE_APP_ID", "RELEASE_APP_PRIVATE_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(
                  "::error::Add the missing repository secret(s): " + ", ".join(missing),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Create repository-scoped release tag token
        id: release-app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout approved release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate-and-build.outputs.commit }}
          fetch-depth: 0
          token: ${{ steps.release-app-token.outputs.token }}
          persist-credentials: true
      - name: Configure audited release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push annotated release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --refs origin "$tag_ref" >/dev/null; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          git tag --annotate --message "Release $RELEASE_TAG" "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push origin "$tag_ref"

  publish:
    name: Publish verified GitHub Release
    needs:
      - gate-and-build
      - create-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.gate-and-build.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.gate-and-build.outputs.commit }}
      RELEASE_NAME: ${{ needs.gate-and-build.outputs.release_name }}
      RELEASE_PRERELEASE: ${{ needs.gate-and-build.outputs.prerelease }}

    steps:
      - name: Download verified build evidence
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.gate-and-build.outputs.release_tag }}-${{ github.run_id }}
          path: dist

      - name: Set up Python for release asset verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify downloaded provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SHA256SUMS
          test -s dist/PROVENANCE.json
          grep -Fq "\"commit\": \"${RELEASE_COMMIT}\"" dist/PROVENANCE.json
          grep -Fq "\"tag\": \"${RELEASE_TAG}\"" dist/PROVENANCE.json
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Create or update GitHub Release with verified assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: dist/release-body.md
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          files: |
            dist/latent_anything-1.0.0-py3-none-any.whl
            dist/latent_anything-1.0.0.tar.gz
            dist/SHA256SUMS
            dist/PROVENANCE.json
            dist/release-body.md
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Verify uploaded GitHub Release asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/remote
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist/remote \
            --clobber
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "latent_anything-1.0.0-py3-none-any.whl",
              "latent_anything-1.0.0.tar.gz",
              "SHA256SUMS",
              "PROVENANCE.json",
              "release-body.md",
          }
          local = Path("dist")
          remote = local / "remote"
          actual = {path.name for path in remote.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected GitHub Release asset set: {sorted(actual)}")
          for name in sorted(expected):
              local_digest = hashlib.sha256((local / name).read_bytes()).hexdigest()
              remote_digest = hashlib.sha256((remote / name).read_bytes()).hexdigest()
              if local_digest != remote_digest:
                  raise SystemExit(
                      f"GitHub Release asset hash mismatch for {name}: "
                      f"{remote_digest} != {local_digest}"
                  )
          print("Verified exact GitHub Release assets and SHA-256 hashes")
          PY

  publish-pypi:
    name: Publish verified distributions to PyPI
    needs:
      - gate-and-build
      - attest-artifacts
      - create-release-tag
      - publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/latent-anything/
    permissions:
      attestations: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.gate-and-build.outputs.release_tag }}
      RELEASE_COMMIT: ${{ needs.gate-and-build.outputs.commit }}

    steps:
      - name: Download verified build evidence
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.gate-and-build.outputs.release_tag }}-${{ github.run_id }}
          path: dist

      - name: Verify package checksums, provenance, and exact distribution set
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SHA256SUMS
          test -s dist/PROVENANCE.json
          test -s dist/release-body.md
          (cd dist && sha256sum --check SHA256SUMS)
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          expected = {
              "latent_anything-1.0.0-py3-none-any.whl",
              "latent_anything-1.0.0.tar.gz",
          }
          actual = {path.name for path in dist.iterdir() if path.is_file() and path.suffix in {".whl", ".gz"}}
          if actual != expected:
              raise SystemExit(f"unexpected distribution set: {sorted(actual)}")
          provenance = json.loads((dist / "PROVENANCE.json").read_text(encoding="utf-8"))
          if (
              provenance.get("schema") != "latent-anything-release-provenance-v1"
              or provenance.get("tag") != os.environ["RELEASE_TAG"]
              or provenance.get("commit") != os.environ["RELEASE_COMMIT"]
              or provenance.get("repository") != os.environ["GITHUB_REPOSITORY"]
              or provenance.get("workflow_run") != os.environ["GITHUB_RUN_ID"]
          ):
              raise SystemExit("release artifact provenance does not match the approved candidate")
          files = provenance.get("files")
          if not isinstance(files, list):
              raise SystemExit("release artifact provenance has no file records")
          recorded = {item["name"]: item["sha256"] for item in files}
          if len(recorded) != len(files) or set(recorded) != expected:
              raise SystemExit(f"unexpected provenance file set: {sorted(recorded)}")
          for name, digest in recorded.items():
              actual_digest = hashlib.sha256((dist / name).read_bytes()).hexdigest()
              if digest != actual_digest:
                  raise SystemExit(f"provenance digest mismatch for {name}")
          PY

      - name: Verify GitHub build attestations
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/latent_anything-1.0.0-py3-none-any.whl dist/latent_anything-1.0.0.tar.gz; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Stage only verified PyPI distributions
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          source = Path("dist")
          packages = Path("dist-pypi")
          expected = {
              "latent_anything-1.0.0-py3-none-any.whl",
              "latent_anything-1.0.0.tar.gz",
          }
          provenance = json.loads((source / "PROVENANCE.json").read_text(encoding="utf-8"))
          files = provenance.get("files")
          if not isinstance(files, list):
              raise SystemExit("release artifact provenance has no file records")
          verified = {item["name"]: item["sha256"] for item in files}
          if len(verified) != len(files) or set(verified) != expected:
              raise SystemExit(f"unexpected provenance file set: {sorted(verified)}")
          if packages.exists():
              raise SystemExit("PyPI distribution staging directory already exists")
          packages.mkdir()
          for name in sorted(expected):
              original = source / name
              if hashlib.sha256(original.read_bytes()).hexdigest() != verified[name]:
                  raise SystemExit(f"verified distribution changed before staging: {name}")
              staged = packages / name
              shutil.copyfile(original, staged)
              if hashlib.sha256(staged.read_bytes()).hexdigest() != verified[name]:
                  raise SystemExit(f"staged distribution hash mismatch for {name}")
          staged_files = {path.name for path in packages.iterdir() if path.is_file()}
          if staged_files != expected:
              raise SystemExit(f"unexpected PyPI staging set: {sorted(staged_files)}")
          print("Verified PyPI staging contains only the hash-matched wheel and sdist")
          PY

      - name: Publish distributions and attestations with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist-pypi
          attestations: true
