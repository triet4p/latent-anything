name: Deploy combined theory + API guide to GitHub Pages

on:
  # Combined theory + API-guide publication. Both theory-v* tags and guide-v*
  # tags run the same single deploy so the theory root is never replaced by an
  # API-only push; the merged tree (theory at /, guide at /api/) is published
  # atomically with force_orphan. Manual dispatch stays for emergency rebuilds.
  push:
    tags:
      - "theory-v*"
      - "guide-v*"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync theory docs environment
        run: uv sync --project latent-anything-theory --group dev --locked

      - name: Execute theory notebooks
        run: |
          find latent-anything-theory -path '*/notebooks/*.ipynb' -type f -print0 | while IFS= read -r -d '' notebook; do
            echo "Executing $notebook"
            uv run --project latent-anything-theory --group dev \
              python -m jupyter nbconvert \
              --to notebook \
              --execute \
              --inplace \
              --ExecutePreprocessor.timeout=600 \
              "$notebook"
          done

      - name: Verify notebook image outputs
        run: |
          uv run --project latent-anything-theory --group dev python - <<'PY'
          import json
          from pathlib import Path

          missing_images = []
          for notebook in Path("latent-anything-theory").rglob("*.ipynb"):
              if "notebooks" not in notebook.parts:
                  continue

              data = json.loads(notebook.read_text(encoding="utf-8"))
              code_cells = [
                  cell for cell in data.get("cells", [])
                  if cell.get("cell_type") == "code"
              ]
              has_matplotlib_show = any(
                  "plt.show(" in "".join(cell.get("source", []))
                  for cell in code_cells
              )
              has_png_output = any(
                  "image/png" in output.get("data", {})
                  for cell in code_cells
                  for output in cell.get("outputs", [])
              )

              if has_matplotlib_show and not has_png_output:
                  missing_images.append(str(notebook))

          if missing_images:
              print("Notebooks with plt.show() but no image/png outputs:")
              for notebook in missing_images:
                  print(f"- {notebook}")
              raise SystemExit(1)

          print("Notebook image outputs verified.")
          PY

      - name: Build theory MkDocs site
        run: uv run --project latent-anything-theory --group dev mkdocs build --strict

      - name: Sync API guide environment
        run: uv sync --locked --extra docs

      - name: Build API guide site
        run: uv run --locked --no-sync mkdocs build --strict --config-file mkdocs-api.yml

      - name: Merge guide tree under api/
        run: uv run --locked --no-sync python scripts/merge_pages_trees.py

      - name: Audit merged internal links
        run: uv run --locked --no-sync python scripts/check_pages_links.py

      - name: Deploy combined tree to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.gh-pages-build
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: combined theory + API guide from ${{ github.sha }}"
