name: Release App Token Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-token:
    if: github.ref == 'refs/heads/main' && github.repository == 'triet4p/latent-anything'
    name: Verify release App credentials without writing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the default branch and expected App identity
        shell: bash
        env:
          EXPECTED_APP_ID: "5083983"
          EXPECTED_REPOSITORY: triet4p/latent-anything
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "::error::This nonpublishing proof may run only from the default branch of the target repository."
            exit 1
          fi
          if [[ ! "${RELEASE_APP_ID:-}" =~ ^[0-9]+$ || "$RELEASE_APP_ID" != "$EXPECTED_APP_ID" ]]; then
            echo "::error::The configured App ID does not match the stable-tag ruleset integration actor."
            exit 1
          fi
          echo "Default-branch and stable-tag App identity guards passed."

      - name: Mint a single-repository contents-write token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Verify App, installation grant, and repository scope
        shell: bash
        env:
          EXPECTED_APP_ID: "5083983"
          EXPECTED_OWNER: ${{ github.repository_owner }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createSign } = require("node:crypto");

          const encode = (value) => Buffer.from(value).toString("base64url");
          const appJwt = () => {
            const now = Math.floor(Date.now() / 1000);
            const header = encode(JSON.stringify({ alg: "RS256", typ: "JWT" }));
            const payload = encode(
              JSON.stringify({ iat: now - 60, exp: now + 540, iss: process.env.RELEASE_APP_ID }),
            );
            const unsigned = `${header}.${payload}`;
            const signer = createSign("RSA-SHA256");
            signer.update(unsigned);
            signer.end();
            return `${unsigned}.${signer.sign(process.env.RELEASE_APP_PRIVATE_KEY, "base64url")}`;
          };

          const getJson = async (path, token) => {
            const response = await fetch(`https://api.github.com${path}`, {
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${token}`,
                "x-github-api-version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API request failed (HTTP ${response.status})`);
            }
            return response.json();
          };

          const verify = async () => {
            const jwt = appJwt();
            const app = await getJson("/app", jwt);
            if (
              String(app.id) !== process.env.RELEASE_APP_ID ||
              String(app.id) !== process.env.EXPECTED_APP_ID ||
              app.slug !== process.env.APP_SLUG
            ) {
              throw new Error("The App ID or bot identity did not match the stable-tag integration actor.");
            }

            if (!/^\d+$/.test(process.env.INSTALLATION_ID)) {
              throw new Error("The token action did not return a valid installation ID.");
            }
            const installation = await getJson(`/app/installations/${process.env.INSTALLATION_ID}`, jwt);
            if (
              String(installation.id) !== process.env.INSTALLATION_ID ||
              String(installation.app_id) !== String(app.id) ||
              installation.account?.login?.toLowerCase() !== process.env.EXPECTED_OWNER.toLowerCase() ||
              installation.repository_selection !== "selected"
            ) {
              throw new Error("The App installation identity, owner, or repository-selection policy was unexpected.");
            }

            const permissions = installation.permissions ?? {};
            const permissionNames = Object.keys(permissions);
            if (
              permissions.contents !== "write" ||
              (permissions.metadata !== undefined && permissions.metadata !== "read") ||
              permissionNames.some((name) => !["contents", "metadata"].includes(name))
            ) {
              throw new Error("The installation does not have the minimum contents-write permission set.");
            }

            const scoped = await getJson("/installation/repositories?per_page=100", process.env.INSTALLATION_TOKEN);
            if (
              scoped.total_count !== 1 ||
              scoped.repositories?.length !== 1 ||
              scoped.repositories[0]?.full_name !== process.env.EXPECTED_REPOSITORY
            ) {
              throw new Error("The installation token is not scoped to exactly the target repository.");
            }
          };

          verify()
            .then(() => {
              console.log(
                "Verified the ruleset App identity, selected installation, contents-write grant, and one-repository token scope. No repository write or release operation was performed.",
              );
            })
            .catch((error) => {
              const message = error instanceof Error ? error.message : "Nonpublishing App verification failed.";
              const safeMessage =
                /^GitHub API request failed \(HTTP \d{3}\)$/.test(message) ||
                [
                  "The App ID or bot identity did not match the stable-tag integration actor.",
                  "The token action did not return a valid installation ID.",
                  "The App installation identity, owner, or repository-selection policy was unexpected.",
                  "The installation does not have the minimum contents-write permission set.",
                  "The installation token is not scoped to exactly the target repository.",
                ].includes(message)
                  ? message
                  : "Nonpublishing App verification failed; credentials were not emitted.";
              console.error(`::error::${safeMessage}`);
              process.exitCode = 1;
            });
          NODE
