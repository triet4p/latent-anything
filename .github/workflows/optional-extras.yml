name: Optional extras

on:
  pull_request:
    paths: ["pyproject.toml", "uv.lock", "src/latent_anything/integrations/**", "src/latent_anything/adapters/vq_vae.py", "tests/test_lerobot_integration.py", "tests/test_lerobot_dataset_bridge.py", "tests/test_lerobot_act.py", "tests/test_lerobot_diffusion.py", "tests/test_lerobot_smolvla.py", "tests/test_lerobot_benchmark.py", "tests/test_latent_anything/test_vq_vae.py", "tests/test_vq_vae_benchmark.py", "scripts/lerobot_dataset_inspection.py", "scripts/act_policy_representation_benchmark.py", "scripts/diffusion_policy_representation_benchmark.py", "scripts/smolvla_policy_representation_benchmark.py", "scripts/smolvla_simulation_benchmark.py", "scripts/vq_vae_digits_evidence.py", "docs/LEROBOT_INTEGRATION.md", "docs/VQ_VAE_INTEGRATION.md"]
  workflow_dispatch:

jobs:
  discrete-latent-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run --locked pytest tests/test_latent_anything/test_vq_vae.py tests/test_vq_vae_benchmark.py -q

  resolve-extra:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        extra: [diffusers, transformers, "3d", lerobot, lerobot-diffusion, lerobot-smolvla]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra ${{ matrix.extra }}
      - run: uv run python -c "import latent_anything"

  lerobot-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra lerobot
      - name: Check the supported runtime and raw upstream seams
        run: uv run --locked --extra lerobot python -c "from latent_anything.integrations.lerobot import check_lerobot_compatibility, load_lerobot_api; report = check_lerobot_compatibility(); assert report.supported, report.diagnostic; api = load_lerobot_api(); assert api.dataset_type.__name__ == 'LeRobotDataset'"
      - name: Run CPU compatibility smoke tests
        run: uv run --locked --extra lerobot pytest tests/test_lerobot_integration.py tests/test_lerobot_dataset_bridge.py tests/test_lerobot_act.py -v

  lerobot-diffusion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra lerobot-diffusion
      - run: uv run --locked --extra lerobot-diffusion pytest tests/test_lerobot_diffusion.py -v

  lerobot-smolvla:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra lerobot-smolvla
      - run: uv run --locked --extra lerobot-smolvla pytest tests/test_lerobot_smolvla.py tests/test_lerobot_benchmark.py -v
